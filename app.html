      <div class="prop"><label for="as-where">Collegato a</label><select class="inp" id="as-where" name="where">${projectOptions(where)}</select></div>
    </div>
    <div class="prop"><label for="as-note">Nota</label><input class="inp" id="as-note" name="note" value="${esc(x.note || '')}" placeholder="Versione finale, accesso con l'account del cliente…"></div>
    <div class="acts"><span class="left" id="as-del-wrap"><button type="button" class="btn ghost sm danger" data-act="del-asset">Elimina</button></span><button type="button" class="btn" data-act="close-ov">Annulla</button><button class="btn primary" type="submit">Salva</button></div>
  </form>`;
  $('#ov').hidden = false;
  $('#as-name').focus();
}
const splitWhere = w => w.startsWith('p:') ? { projectId: w.slice(2), areaId: null } : w.startsWith('a:') ? { projectId: null, areaId: w.slice(2) } : { projectId: null, areaId: null };

/* chiusura giornata */
function openClose() {
  const today = todayISO();
  const nwd = nextWorkday(today);
  const existing = S.days.get(today);
  const leftover = openTasks().filter(t => t.status === 'open' && t.due && t.due <= today).sort(byDue);
  const doneToday = [...S.tasks.values()].filter(t => t.status === 'done' && (t.doneAt || '').slice(0, 10) === today);
  const nwdLabel = fmtDay(nwd);
  S.sheet = { type: 'close', today, nwd, leftover: leftover.map(t => t.id) };
  const extraTxt = (existing?.extra || []).map(x => {
    const p = x.projectId && S.projects.get(x.projectId);
    const a = !p && x.areaId && S.areas.get(x.areaId);
    return x.text + (p ? ' #' + slug(p.name) : a ? ' #' + slug(a.name) : '');
  }).join('\n');
  const chosen = new Set(existing?.tomorrow || []);
  const cands = openTasks().filter(t => t.status === 'open' && (!t.due || t.due <= nwd)).sort(byDue).slice(0, 14);
  $('#ov').innerHTML = `<form class="sheet wide" data-form="close" role="dialog" aria-modal="true" aria-labelledby="cl-h" autocomplete="off">
    <h2 id="cl-h">Chiudi la giornata</h2><p class="sub">${esc(fmtLong(today))}. Due minuti per registrare cosa hai fatto e decidere da dove ripartire.</p>
    <div class="step"><h3><span class="n">1</span>Fatto oggi <span class="n">${doneToday.length}</span></h3>
      ${doneToday.length ? `<ul>${doneToday.map(t => `<li>${esc(t.title)}${chipProject(t) ? ' ' + chipProject(t) : ''}</li>`).join('')}</ul>` : '<div style="color:var(--muted);font-size:14px">Nessun compito spuntato oggi.</div>'}</div>
    <div class="step"><h3><span class="n">2</span><label for="cl-extra">Cos'altro hai fatto?</label></h3>
      <textarea class="inp" id="cl-extra" name="extra" rows="3" placeholder="Una cosa per riga. Aggiungi #progetto per collegarla, es.&#10;call con Marco sul preventivo #CloudSherpa">${esc(extraTxt)}</textarea></div>
    ${leftover.length ? `<div class="step"><h3><span class="n">3</span>Rimasti da oggi <span class="n">${leftover.length}</span></h3>
      ${leftover.map(t => `<div class="mv"><span class="t">${esc(t.title)}${t.due < today ? ` <span class="chip danger">${esc(relDay(t.due))}</span>` : ''}</span><select class="inp" name="mv-${esc(t.id)}" aria-label="Cosa fare con ${esc(t.title)}"><option value="next">Sposta a ${esc(nwdLabel)}</option><option value="week">Tra una settimana</option><option value="keep">Lascia com'è</option><option value="none">Togli la data</option><option value="done">Era fatto</option></select></div>`).join('')}</div>` : ''}
    <div class="step"><h3><span class="n">${leftover.length ? 4 : 3}</span>Le 3 priorità per ${esc(nwdLabel)}</h3>
      ${cands.length ? cands.map(t => `<label class="pick"><input type="checkbox" name="prio" value="${esc(t.id)}" ${chosen.has(t.id) ? 'checked' : ''}><span>${esc(t.title)}</span>${chipProject(t)}</label>`).join('') : '<div style="color:var(--muted);font-size:14px">Nessun compito aperto: aggiungine dalla barra in alto, poi torna qui.</div>'}</div>
    <div class="step"><h3><span class="n">${leftover.length ? 5 : 4}</span><label for="cl-note">Nota del giorno</label></h3>
      <textarea class="inp" id="cl-note" name="note" rows="2" placeholder="Com'è andata, cosa hai imparato, cosa ti blocca">${esc(existing?.note || '')}</textarea></div>
    <div class="acts"><button type="button" class="btn" data-act="close-ov">Annulla</button><button class="btn primary" type="submit">${existing?.closedAt ? 'Aggiorna la chiusura' : 'Chiudi la giornata'}</button></div>
  </form>`;
  $('#ov').hidden = false;
  $('#cl-extra').focus();
}
function parseExtra(text) {
  const ctx = ctxForParse();
  return text.split('\n').map(l => l.trim()).filter(Boolean).map(l => {
    const tm = l.match(/(^|\s)#([\p{L}\p{N}_.\-]+)/u);
    let projectId = null, areaId = null, out = l;
    if (tm) {
      const hit = matchTag(tm[2], ctx);
      if (hit) { if (hit.kind === 'project') { projectId = hit.item.id; areaId = hit.item.areaId || null; } else areaId = hit.item.id; out = (l.slice(0, tm.index) + ' ' + l.slice(tm.index + tm[0].length)).replace(/\s+/g, ' ').trim(); }
    }
    return { text: out, projectId, areaId };
  });
}
async function saveClose(form) {
  const { today, nwd, leftover } = S.sheet;
  const fd = new FormData(form);
  const now = nowISO();
  const patches = new Map();
  const patch = (id, d) => patches.set(id, { ...(patches.get(id) || {}), ...d });
  const markedDone = new Set();
  for (const id of leftover) {
    const v = fd.get('mv-' + id);
    if (v === 'next') patch(id, { due: nwd });
    else if (v === 'week') patch(id, { due: addDays(today, 7) });
    else if (v === 'none') patch(id, { due: null });
    else if (v === 'done') { patch(id, { status: 'done', doneAt: now }); markedDone.add(id); }
  }
  // le priorità scelte vanno in agenda per il prossimo giorno lavorativo
  const prio = fd.getAll('prio').map(String).filter(id => !markedDone.has(id)).slice(0, 3);
  for (const id of prio) { const t = S.tasks.get(id); const due = patches.get(id)?.due ?? t?.due; if (t && due !== nwd) patch(id, { due: nwd }); }
  const doneList = [...S.tasks.values()].filter(t => (t.status === 'done' && (t.doneAt || '').slice(0, 10) === today) || markedDone.has(t.id))
    .map(t => ({ id: t.id, title: t.title, projectId: t.projectId || null, areaId: t.areaId || (t.projectId ? S.projects.get(t.projectId)?.areaId || null : null) }));
  const extra = parseExtra(String(fd.get('extra') || ''));
  const writes = [...patches].map(([id, d]) => updDoc('tasks', id, d));
  writes.push(setDoc('days', today, { date: today, done: doneList, extra, note: String(fd.get('note') || '').trim(), tomorrow: prio, tomorrowDate: nwd, closedAt: now }));
  const touched = new Set([...extra.map(x => x.projectId), ...doneList.filter(x => markedDone.has(x.id)).map(x => x.projectId)].filter(Boolean));
  touched.forEach(id => writes.push(updDoc('projects', id, { updatedAt: now })));
  const res = await Promise.all(writes);
  closeOv();
  if (res.every(Boolean)) toast(`Giornata chiusa.${prio.length ? ` ${prio.length} ${prio.length === 1 ? 'priorità' : 'priorità'} per ${fmtDay(nwd)}.` : ''}`);
}

/* palette "vai a" */
function openPalette() {
  S.sheet = { type: 'pal', i: 0, items: [] };
  $('#ov').innerHTML = `<div class="sheet pal" role="dialog" aria-modal="true" aria-label="Vai a"><input id="pal-q" placeholder="Vai a un progetto, un'area, un asset o un compito" aria-label="Cerca"><div class="res" id="pal-res"></div></div>`;
  $('#ov').hidden = false;
  const inp = $('#pal-q');
  inp.addEventListener('input', renderPalette);
  inp.addEventListener('keydown', e => {
    const s = S.sheet;
    if (e.key === 'ArrowDown' || e.key === 'ArrowUp') { e.preventDefault(); s.i = (s.i + (e.key === 'ArrowDown' ? 1 : -1) + s.items.length) % Math.max(1, s.items.length); renderPalette(true); }
    if (e.key === 'Enter') { e.preventDefault(); runPal(s.items[s.i]); }
  });
  renderPalette();
  inp.focus();
}
function renderPalette(keepSel) {
  const q = key($('#pal-q').value);
  const s = S.sheet;
  const all = [
    ...VIEWS.map(([v, l]) => ({ label: l, kind: 'Vista', go: '#' + v })),
    ...projectsAll().map(p => ({ label: p.name, kind: isActive(p) ? 'Progetto' : 'Progetto · ' + p.status, go: '#p-' + p.id })),
    ...areasSorted().map(a => ({ label: a.name, kind: 'Area', go: '#a-' + a.id })),
    ...[...S.assets.values()].map(x => ({ label: x.name, kind: 'Asset · ' + (x.type || 'Link'), url: safeUrl(x.url), asset: x.id })),
    ...openTasks().map(t => ({ label: t.title, kind: 'Compito', task: t.id })),
  ];
  s.items = (q ? all.filter(i => key(i.label).includes(q)) : all.slice(0, 6 + Math.min(8, S.projects.size))).slice(0, 30);
  if (!keepSel) s.i = 0;
  $('#pal-res').innerHTML = s.items.length ? s.items.map((it, i) => `<button type="button" data-i="${i}" aria-selected="${i === s.i}">${esc(it.label)}<small>${esc(it.kind)}</small></button>`).join('') : '<div class="empty" style="margin:6px">Nessun risultato.</div>';
}
function runPal(it) {
  if (!it) return;
  closeOv();
  if (it.go) location.hash = it.go.slice(1);
  else if (it.task) openTaskSheet(it.task);
  else if (it.url) { const a = document.createElement('a'); a.href = it.url; a.target = '_blank'; a.rel = 'noopener'; document.body.appendChild(a); a.click(); a.remove(); }
  else if (it.asset) openAssetSheet(it.asset);
}

/* ---------- eventi ---------- */
document.addEventListener('click', async e => {
  const el = e.target.closest('[data-act]');
  if (!el) {
    const row = e.target.closest('.row');
    if (row) { S.selId = row.dataset.task; $$('.row.sel').forEach(r => r.classList.remove('sel')); row.classList.add('sel'); }
    if (e.target.id === 'ov') closeOv();
    const pr = e.target.closest('#pal-res button');
    if (pr) runPal(S.sheet.items[+pr.dataset.i]);
    return;
  }
  const act = el.dataset.act;
  const row = el.closest('[data-task]');
  const tid = row?.dataset.task;
  const p = S.view === 'progetto' ? S.projects.get(S.param) : null;
  switch (act) {
    case 'toggle': e.preventDefault(); toggleTask(tid); break;
    case 'edit': openTaskSheet(tid); break;
    case 'close-day': openClose(); break;
    case 'close-ov': closeOv(); break;
    case 'pfilter': S.projFilter = el.dataset.v; render(); break;
    case 'toggle-archive': S.showArchive = !S.showArchive; render(); break;
    case 'toggle-log': S.showAllLog = !S.showAllLog; render(); break;
    case 'new-project': e.preventDefault(); newProject(el.dataset.area); break;
    case 'new-area': newArea(); break;
    case 'complete-project': if (p) { await updDoc('projects', p.id, { status: 'completato', hill: 100, updatedAt: nowISO() }); toast('Progetto completato'); } break;
    case 'del-project': S.confirmDel = p?.id; render(); break;
    case 'del-area': S.confirmDel = S.param; render(); break;
    case 'del-project-no': S.confirmDel = null; render(); break;
    case 'del-project-yes': if (p) {
      const tasks = projectTasks(p.id);
      const assets = [...S.assets.values()].filter(x => x.projectId === p.id);
      await Promise.all([...tasks.map(t => delDoc('tasks', t.id)), ...assets.map(x => updDoc('assets', x.id, { projectId: null, areaId: p.areaId || null }))]);
      await delDoc('projects', p.id); S.confirmDel = null; location.hash = 'progetti'; toast('Progetto eliminato');
    } break;
    case 'del-area-yes': {
      const id = S.param;
      await Promise.all(projectsAll().filter(x => x.areaId === id).map(x => updDoc('projects', x.id, { areaId: null })));
      await delDoc('areas', id); S.confirmDel = null; location.hash = 'aree'; toast('Area eliminata');
    } break;
    case 'area-color': await updDoc('areas', S.param, { color: el.dataset.v }); break;
    case 'set-due': $('#ts-due').value = el.dataset.v; break;
    case 'del-task': {
      const w = $('#ts-del-wrap');
      if (w.dataset.armed) { const id = S.sheet.id; closeOv(); await delDoc('tasks', id); toast('Compito eliminato'); }
      else { w.dataset.armed = '1'; el.textContent = 'Conferma eliminazione'; el.classList.add('solid'); }
    } break;
    case 'del-asset': {
      const w = $('#as-del-wrap');
      if (w.dataset.armed) { const id = S.sheet.id; closeOv(); await delDoc('assets', id); toast('Asset eliminato'); }
      else { w.dataset.armed = '1'; el.textContent = 'Conferma eliminazione'; el.classList.add('solid'); }
    } break;
    case 'edit-asset': openAssetSheet(el.closest('[data-asset]').dataset.asset); break;
    case 'copy-url': {
      const x = S.assets.get(el.closest('[data-asset]').dataset.asset);
      try { await navigator.clipboard.writeText(x.url); toast('Link copiato'); } catch { toast(x.url); }
    } break;
  }
});

document.addEventListener('submit', async e => {
  const f = e.target;
  const kind = f.dataset.form;
  if (!kind) return;
  e.preventDefault();
  const fd = new FormData(f);
  if (kind === 'task') {
    const id = S.sheet.id;
    const status = fd.get('status');
    const t = S.tasks.get(id);
    const data = { title: String(fd.get('title')).trim() || t.title, ...splitWhere(String(fd.get('where'))), due: fd.get('due') || null, status, waitingFor: String(fd.get('waitingFor') || '').trim(), note: String(fd.get('note') || '').trim() };
    if (status === 'done' && t.status !== 'done') data.doneAt = nowISO();
    if (status !== 'done') data.doneAt = null;
    closeOv();
    if (await updDoc('tasks', id, data)) { if (data.projectId) touchProject(data.projectId); toast('Salvato'); }
  } else if (kind === 'asset-edit') {
    const id = S.sheet.id;
    const data = { name: String(fd.get('name')).trim(), url: String(fd.get('url')).trim(), type: fd.get('type'), note: String(fd.get('note') || '').trim(), ...splitWhere(String(fd.get('where'))) };
    closeOv();
    if (await updDoc('assets', id, data)) toast('Salvato');
  } else if (kind === 'asset') {
    const url = String(fd.get('url') || '').trim();
    const name = String(fd.get('name') || '').trim() || detectAsset(url).name || url;
    if (!name) { toast('Scrivi almeno un nome o un link'); return; }
    const fixed = f.dataset.fixed;
    const where = fixed ? { projectId: fixed, areaId: null } : splitWhere(String(fd.get('where') || ''));
    if (await setDoc('assets', uid(), { name, url, type: fd.get('type') || 'Link', note: '', ...where, createdAt: nowISO() })) {
      f.reset(); toast(`Asset aggiunto: ${name}`);
      if (where.projectId) touchProject(where.projectId);
    }
  } else if (kind === 'ptask') {
    const v = String(fd.get('t') || '').trim();
    if (!v) return;
    f.reset();
    await createFromText(v, { projectId: S.param });
    S.focusAfter = 'p-newtask';
  } else if (kind === 'plog') {
    const v = String(fd.get('t') || '').trim();
    if (!v) return;
    f.reset();
    const today = todayISO();
    const p = S.projects.get(S.param);
    const day = S.days.get(today);
    const item = { text: v, projectId: p.id, areaId: p.areaId || null };
    const ok = day ? await updDoc('days', today, { extra: [...(day.extra || []), item] }) : await setDoc('days', today, { date: today, done: [], extra: [item], note: '', tomorrow: [], tomorrowDate: null, closedAt: null });
    if (ok) { touchProject(p.id); toast('Annotato'); }
  } else if (kind === 'close') {
    await saveClose(f);
  }
});

// campi del progetto e dell'area: salva quando cambiano
document.addEventListener('change', async e => {
  const el = e.target;
  if (el.dataset.field && S.view === 'progetto') {
    const p = S.projects.get(S.param);
    if (!p) return;
    let v = el.value;
    if (el.dataset.field === 'name') v = v.trim() || p.name;
    if (el.dataset.field === 'deadline' || el.dataset.field === 'areaId') v = v || null;
    if ((p[el.dataset.field] ?? null) === v || (p[el.dataset.field] ?? '') === v) return;
    const data = { [el.dataset.field]: v, updatedAt: nowISO() };
    if (el.dataset.field === 'status' && v === 'completato') data.hill = 100;
    await updDoc('projects', p.id, data);
  } else if (el.dataset.afield && S.view === 'area') {
    const v = el.value.trim();
    if (v && v !== S.areas.get(S.param)?.name) await updDoc('areas', S.param, { name: v });
  } else if (el.id === 'p-hill') {
    await updDoc('projects', S.param, { hill: +el.value, updatedAt: nowISO() });
  } else if (el.id === 'asset-f') {
    S.assetF = el.value; render();
  }
});
document.addEventListener('input', e => {
  const el = e.target;
  if (el.id === 'p-hill') {
    const x = +el.value / 100, W = 600, base = 104, amp = 82;
    const dot = $('#hill-dot');
    const [st, lbl] = hillState(el.value);
    dot.setAttribute('cx', (10 + x * (W - 20)).toFixed(1));
    dot.setAttribute('cy', hillY(x, base, amp).toFixed(1));
    dot.setAttribute('fill', `var(--${st})`);
    const l = $('#hill-lbl'); l.textContent = lbl; l.style.color = `var(--${st})`;
  } else if (el.id === 'asset-q') {
    S.assetQ = el.value; render();
  } else if (el.name === 'url' && el.closest('[data-form="asset"]')) {
    const f = el.closest('form');
    const d = detectAsset(el.value.trim());
    if (el.value.trim()) { f.elements.type.value = d.type; if (!f.elements.name.dataset.touched && d.name) f.elements.name.value = d.name; }
  } else if (el.name === 'name' && el.closest('[data-form="asset"]')) {
    el.dataset.touched = el.value ? '1' : '';
  } else if (el.name === 'prio') {
    const checked = $$('input[name="prio"]:checked');
    if (checked.length > 3) { el.checked = false; toast('Massimo 3 priorità: tienile poche'); }
  }
});
document.addEventListener('keydown', e => {
  if (e.key === 'Enter' && e.target.classList?.contains('field-title') && !e.target.closest('form')) { e.preventDefault(); e.target.blur(); }
});

/* scorciatoie */
let gPending = 0;
document.addEventListener('keydown', e => {
  const tag = (e.target.tagName || '').toLowerCase();
  const typing = ['input', 'textarea', 'select'].includes(tag) || e.target.isContentEditable;
  if ((e.metaKey || e.ctrlKey) && e.key.toLowerCase() === 'k') { e.preventDefault(); closeOv(); qa.focus(); return; }
  if (e.key === 'Escape' && !$('#ov').hidden) { e.preventDefault(); closeOv(); return; }
  if (typing || e.metaKey || e.ctrlKey || e.altKey || !$('#ov').hidden) return;
  const k = e.key.toLowerCase();
  if (gPending && Date.now() - gPending < 1200) {
    gPending = 0;
    const map = { o: 'oggi', p: 'prossimi', r: 'progetti', a: 'aree', s: 'asset', l: 'registro' };
    if (map[k]) { e.preventDefault(); location.hash = map[k]; }
    return;
  }
  if (k === 'g') { gPending = Date.now(); return; }
  if (k === 'n') { e.preventDefault(); qa.focus(); return; }
  if (k === '/') { e.preventDefault(); openPalette(); return; }
  if (k === 'c') { e.preventDefault(); openClose(); return; }
  const rows = $$('#view .row');
  if (!rows.length) return;
  let i = rows.findIndex(r => r.dataset.task === S.selId);
  if (k === 'j' || e.key === 'ArrowDown') { e.preventDefault(); i = Math.min(rows.length - 1, i + 1); }
  else if (k === 'k' || e.key === 'ArrowUp') { e.preventDefault(); i = Math.max(0, i - 1); }
  else if (k === 'x' && i >= 0) { e.preventDefault(); toggleTask(S.selId); return; }
  else if ((k === 'e' || e.key === 'Enter') && i >= 0) { e.preventDefault(); openTaskSheet(S.selId); return; }
  else return;
  S.selId = rows[i].dataset.task;
  rows.forEach(r => r.classList.toggle('sel', r === rows[i]));
  rows[i].scrollIntoView({ block: 'nearest' });
});

/* routing */
function route() {
  const h = decodeURIComponent(location.hash.slice(1));
  S.confirmDel = null; S.showAllLog = false;
  if (h.startsWith('p-')) { S.view = 'progetto'; S.param = h.slice(2); }
  else if (h.startsWith('a-')) { S.view = 'area'; S.param = h.slice(2); }
  else { S.view = VIEWS.some(([v]) => v === h) ? h : 'oggi'; S.param = null; }
  S.selId = null;
  render();
  window.scrollTo(0, 0);
}
window.addEventListener('hashchange', route);

/* avvio */
async function start() {
  route();
  let db = null;
  if (window.__TEST_SEED__) db = null;
  else {
    try { db = window.claude?.use ? await window.claude.use('db') : null; } catch { db = null; }
  }
  if (!db) {
    S.local = true;
    db = memoryDB(window.__TEST_SEED__);
    if (!window.__TEST_SEED__) showBanner('Anteprima senza salvataggio: apri questa pagina da claude.ai per conservare progetti e compiti.');
  }
  S.db = db;
  subscribe();
}
window.__parseQuick = parseQuick;
start();
})();
