<title>Progetti di Andrea</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Schibsted+Grotesk:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
/* Layout: barra laterale fissa (su telefono tab in basso) + colonna di lavoro con l'inserimento rapido sempre in alto */
:root {
  --bg: #f4f5f8;
  --surface: #ffffff;
  --sunken: #eceef3;
  --ink: #171a21;
  --muted: #5e6575;
  --faint: #8d93a1;
  --line: #e1e4ea;
  --accent: #2f4fc4;
  --accent-ink: #ffffff;
  --accent-soft: #e6ebfb;
  --up: #b4700e;
  --up-soft: #fbf0dd;
  --down: #24804f;
  --down-soft: #e0f2e7;
  --danger: #c23b2b;
  --danger-soft: #fbe6e3;
  --shadow: 0 1px 2px rgb(20 24 40 / .06), 0 8px 24px rgb(20 24 40 / .08);
  --f-display: "Schibsted Grotesk", ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
  --f-body: "Schibsted Grotesk", ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
  --f-mono: "JetBrains Mono", ui-monospace, "SF Mono", Menlo, Consolas, monospace;
  --r: 8px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #101217; --surface: #171a21; --sunken: #1d2129; --ink: #e8eaf0; --muted: #a0a7b5; --faint: #707787;
    --line: #272b35; --accent: #8aa2ff; --accent-ink: #0d1020; --accent-soft: #1e2645;
    --up: #e3a54a; --up-soft: #33280f; --down: #5fc28b; --down-soft: #12301f; --danger: #f07c6c; --danger-soft: #3a1a16;
    --shadow: 0 1px 2px rgb(0 0 0 / .4), 0 8px 24px rgb(0 0 0 / .35);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #101217; --surface: #171a21; --sunken: #1d2129; --ink: #e8eaf0; --muted: #a0a7b5; --faint: #707787;
  --line: #272b35; --accent: #8aa2ff; --accent-ink: #0d1020; --accent-soft: #1e2645;
  --up: #e3a54a; --up-soft: #33280f; --down: #5fc28b; --down-soft: #12301f; --danger: #f07c6c; --danger-soft: #3a1a16;
  --shadow: 0 1px 2px rgb(0 0 0 / .4), 0 8px 24px rgb(0 0 0 / .35);
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { height: 100%; }
body { background: var(--bg); color: var(--ink); font: 15px/1.5 var(--f-body); -webkit-font-smoothing: antialiased; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--bg); }
button, input, select, textarea { font: inherit; color: inherit; }
a { color: var(--accent); }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 4px; }
.mono { font-family: var(--f-mono); font-variant-numeric: tabular-nums; font-size: .86em; }

.app { display: grid; grid-template-columns: 220px minmax(0, 1fr); min-height: 100%; }
.side { position: sticky; top: 0; height: 100vh; padding-block: 20px; padding-left: max(14px, env(safe-area-inset-left, 0px)); padding-right: 14px; border-right: 1px solid var(--line); display: flex; flex-direction: column; gap: 4px; }
.brand { font-family: var(--f-display); font-weight: 700; font-size: 17px; letter-spacing: -.01em; padding: 2px 10px 14px; display: flex; align-items: center; gap: 8px; }
.brand svg { color: var(--accent); }
.nav-a { display: flex; align-items: center; gap: 10px; padding: 7px 10px; border-radius: 6px; color: var(--muted); text-decoration: none; font-weight: 500; }
.nav-a:hover { background: var(--sunken); color: var(--ink); }
.nav-a[aria-current="page"] { background: var(--surface); color: var(--ink); box-shadow: 0 0 0 1px var(--line); }
.nav-a .count { margin-left: auto; font-family: var(--f-mono); font-size: 12px; color: var(--faint); }
.nav-a .count.hot { color: var(--danger); }
.nav-a svg { flex: none; }
.side-areas { margin-top: 18px; display: flex; flex-direction: column; gap: 2px; }
.side-label { font-size: 11px; text-transform: uppercase; letter-spacing: .08em; color: var(--faint); padding: 0 10px 6px; font-weight: 600; }
.dot { width: 8px; height: 8px; border-radius: 50%; flex: none; display: inline-block; }
.side-foot { margin-top: auto; font-size: 12px; color: var(--faint); padding: 0 10px; line-height: 1.7; }
kbd { font-family: var(--f-mono); font-size: 11px; border: 1px solid var(--line); border-bottom-width: 2px; border-radius: 4px; padding: 0 4px; background: var(--surface); color: var(--muted); }

.main { min-width: 0; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-bottom: 80px; }
.main-in { max-width: 860px; margin: 0 auto; }
.qa-wrap { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: var(--bg); padding-block: 16px 10px; }
.qa { display: flex; align-items: center; gap: 10px; background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 0 12px; box-shadow: var(--shadow); }
.qa:focus-within { border-color: var(--accent); }
.qa svg { color: var(--faint); flex: none; }
.qa input { flex: 1; min-width: 0; border: 0; background: transparent; padding: 13px 0; outline: none; font-size: 15px; }
.qa .hint { flex: none; }
.qa-preview { display: flex; flex-wrap: wrap; gap: 6px; padding: 8px 2px 0; min-height: 0; }
.qa-preview:empty { display: none; }
.chip { display: inline-flex; align-items: center; gap: 5px; font-size: 12.5px; padding: 1px 8px; border-radius: 99px; background: var(--sunken); color: var(--muted); white-space: nowrap; max-width: 100%; overflow: hidden; text-overflow: ellipsis; text-decoration: none; border: 0; }
button.chip, a.chip { cursor: pointer; }
.chip.accent { background: var(--accent-soft); color: var(--accent); }
.chip.danger { background: var(--danger-soft); color: var(--danger); }
.chip.up { background: var(--up-soft); color: var(--up); }
.chip.down { background: var(--down-soft); color: var(--down); }
.ac { position: absolute; left: 0; right: 0; top: calc(100% - 4px); background: var(--surface); border: 1px solid var(--line); border-radius: 10px; box-shadow: var(--shadow); padding: 6px; z-index: 6; }
.ac button { display: flex; width: 100%; align-items: center; gap: 8px; text-align: left; border: 0; background: none; padding: 7px 10px; border-radius: 6px; cursor: pointer; }
.ac button[aria-selected="true"], .ac button:hover { background: var(--sunken); }
.ac small { color: var(--faint); margin-left: auto; }

.banner { margin: 0 0 12px; padding: 10px 14px; border-radius: var(--r); background: var(--up-soft); color: var(--up); font-size: 13.5px; }
.banner[hidden] { display: none; }

h1.view-title { font-family: var(--f-display); font-size: 28px; line-height: 1.15; letter-spacing: -.02em; margin: 18px 0 2px; text-wrap: balance; }
.view-sub { color: var(--muted); margin: 0 0 18px; display: flex; flex-wrap: wrap; gap: 6px 14px; align-items: center; }
.head-row { display: flex; align-items: flex-end; gap: 12px; flex-wrap: wrap; }
.head-row .grow { flex: 1; min-width: 0; }
section.block { margin: 22px 0; }
h2.sec { font-size: 12px; text-transform: uppercase; letter-spacing: .08em; color: var(--faint); font-weight: 600; margin: 0 0 8px; display: flex; align-items: center; gap: 8px; }
h2.sec .n { font-family: var(--f-mono); letter-spacing: 0; }
h2.sec.danger { color: var(--danger); }

.btn { display: inline-flex; align-items: center; gap: 6px; border: 1px solid var(--line); background: var(--surface); padding: 6px 12px; border-radius: 7px; cursor: pointer; font-weight: 500; font-size: 14px; text-decoration: none; color: var(--ink); white-space: nowrap; }
.btn:hover { border-color: var(--faint); }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.btn.primary:hover { filter: brightness(1.08); }
.btn.ghost { border-color: transparent; background: transparent; color: var(--muted); }
.btn.ghost:hover { background: var(--sunken); color: var(--ink); }
.btn.danger { color: var(--danger); }
.btn.danger.solid { background: var(--danger); border-color: var(--danger); color: #fff; }
.btn.sm { padding: 3px 9px; font-size: 13px; }

/* righe compito */
.list { display: flex; flex-direction: column; }
.row { display: flex; align-items: flex-start; gap: 10px; padding: 8px 10px; border-radius: 7px; cursor: default; }
.row:hover { background: var(--sunken); }
.row.sel { background: var(--accent-soft); }
.check { flex: none; width: 18px; height: 18px; margin-top: 2px; border: 1.5px solid var(--faint); border-radius: 50%; background: transparent; cursor: pointer; display: grid; place-items: center; padding: 0; }
.check:hover { border-color: var(--accent); }
.check.on { background: var(--down); border-color: var(--down); color: var(--surface); }
.check.wait { border-style: dashed; }
.row .body { flex: 1; min-width: 0; }
.row .t { overflow-wrap: anywhere; cursor: pointer; }
.row.done .t { color: var(--faint); text-decoration: line-through; }
.row .meta { display: flex; flex-wrap: wrap; gap: 4px 6px; margin-top: 3px; }
.row .meta:empty { display: none; }
.row .when { flex: none; font-family: var(--f-mono); font-size: 12px; color: var(--faint); margin-top: 3px; }
.row .when.late { color: var(--danger); }
.empty { color: var(--muted); padding: 14px 10px; border: 1px dashed var(--line); border-radius: var(--r); font-size: 14px; }
.empty b { color: var(--ink); font-weight: 600; }

/* striscia progetti in Oggi */
.strip { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 4px; scrollbar-width: thin; }
.strip a { flex: none; display: flex; flex-direction: column; gap: 2px; min-width: 150px; max-width: 220px; padding: 10px 12px; border-radius: var(--r); background: var(--surface); border: 1px solid var(--line); text-decoration: none; color: var(--ink); }
.strip a:hover { border-color: var(--faint); }
.strip .nm { font-weight: 600; font-size: 14px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.strip .ln { display: flex; align-items: center; gap: 8px; font-size: 12px; color: var(--muted); }

/* card progetti */
.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 250px), 1fr)); gap: 12px; }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 14px 16px; display: flex; flex-direction: column; gap: 8px; text-decoration: none; color: var(--ink); min-width: 0; }
.card:hover { border-color: var(--faint); }
.card .top { display: flex; align-items: center; gap: 6px; font-size: 12.5px; color: var(--muted); min-height: 20px; }
.card .top .st { margin-left: auto; }
.card h3 { margin: 0; font-family: var(--f-display); font-size: 17px; line-height: 1.25; letter-spacing: -.01em; overflow-wrap: anywhere; }
.card .goal { color: var(--muted); font-size: 13.5px; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.card .goal.none { color: var(--faint); font-style: italic; }
.kv { display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 3px 10px; font-size: 13px; align-items: baseline; }
.kv dt { color: var(--faint); }
.kv dd { margin: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.kv dd.late { color: var(--danger); }
.kv dd.warn { color: var(--up); }
.card .foot { display: flex; flex-wrap: wrap; gap: 4px 6px; margin-top: auto; padding-top: 4px; }

.hill-big { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 12px 12px 6px; overflow-x: auto; }
.hill-big svg { display: block; width: 100%; min-width: 520px; height: auto; }
.hill-txt { fill: var(--muted); font: 500 11px var(--f-body); }
.hill-lbl { fill: var(--ink); font: 600 12px var(--f-body); paint-order: stroke; stroke: var(--surface); stroke-width: 4px; stroke-linejoin: round; }
.hill-axis { fill: var(--faint); font: 500 10.5px var(--f-body); text-transform: uppercase; letter-spacing: .08em; }

.filters { display: flex; flex-wrap: wrap; gap: 6px; margin: 0 0 12px; }
.filters button { border: 1px solid var(--line); background: var(--surface); border-radius: 99px; padding: 3px 11px; font-size: 13px; cursor: pointer; color: var(--muted); display: inline-flex; align-items: center; gap: 6px; }
.filters button[aria-pressed="true"] { background: var(--ink); color: var(--bg); border-color: var(--ink); }

/* dettaglio progetto */
.field-title { width: 100%; border: 0; background: transparent; font-family: var(--f-display); font-weight: 700; font-size: 28px; letter-spacing: -.02em; padding: 2px 0; outline: none; border-bottom: 1px dashed transparent; }
.field-title:hover { border-bottom-color: var(--line); }
.field-title:focus { border-bottom-color: var(--accent); }
.props { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 170px), 1fr)); gap: 10px; margin: 12px 0 4px; }
.prop { display: flex; flex-direction: column; gap: 3px; min-width: 0; }
.prop label, .lbl { font-size: 11.5px; text-transform: uppercase; letter-spacing: .07em; color: var(--faint); font-weight: 600; }
.inp { width: 100%; min-width: 0; border: 1px solid var(--line); background: var(--surface); border-radius: 7px; padding: 7px 10px; outline: none; }
.inp:focus { border-color: var(--accent); }
textarea.inp { resize: vertical; min-height: 70px; line-height: 1.5; }
.goal-box { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 12px 14px; margin: 14px 0; }
.goal-box textarea { width: 100%; border: 0; background: transparent; outline: none; resize: vertical; font-size: 16px; line-height: 1.5; min-height: 52px; padding: 0; }
.hill-edit { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 10px 14px 12px; }
.hill-edit svg { display: block; width: 100%; height: auto; }
.hill-edit input[type=range] { width: 100%; accent-color: var(--accent); margin: 0; }
.hill-edit .hl { display: flex; justify-content: space-between; font-size: 12px; color: var(--muted); }
.two { display: grid; grid-template-columns: minmax(0, 1.25fr) minmax(0, 1fr); gap: 24px; }
.tl { display: flex; flex-direction: column; gap: 12px; }
.tl-day { display: grid; grid-template-columns: 74px minmax(0, 1fr); gap: 10px; }
.tl-day .d { font-family: var(--f-mono); font-size: 12px; color: var(--faint); padding-top: 2px; }
.tl-day ul { margin: 0; padding: 0; list-style: none; display: flex; flex-direction: column; gap: 4px; }
.tl-day li { font-size: 14px; overflow-wrap: anywhere; }
.tl-day li .k { font-size: 11px; color: var(--faint); margin-left: 6px; }
.inline-add { display: flex; gap: 8px; margin-top: 6px; }
.inline-add input { flex: 1; min-width: 0; }

/* asset */
.assets { display: flex; flex-direction: column; border: 1px solid var(--line); border-radius: 10px; background: var(--surface); overflow: hidden; }
.asset { display: grid; grid-template-columns: 30px minmax(0, 1fr) auto; gap: 10px; align-items: center; padding: 9px 12px; border-top: 1px solid var(--line); }
.asset:first-child { border-top: 0; }
.asset .ic { width: 30px; height: 30px; border-radius: 7px; background: var(--sunken); display: grid; place-items: center; font: 600 10px var(--f-mono); color: var(--muted); text-transform: uppercase; }
.asset .nm { font-weight: 500; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; display: block; }
.asset a.nm { color: var(--ink); text-decoration: none; }
.asset a.nm:hover { color: var(--accent); text-decoration: underline; }
.asset .sub { font-size: 12.5px; color: var(--faint); display: flex; gap: 6px; flex-wrap: wrap; align-items: center; min-width: 0; }
.asset .acts { display: flex; gap: 2px; }
.asset-form { display: grid; grid-template-columns: minmax(0, 2fr) minmax(0, 1.5fr) minmax(0, 110px) minmax(0, 1.2fr) auto; gap: 8px; padding: 12px; background: var(--sunken); border-radius: 10px; margin-bottom: 12px; align-items: end; }
.asset-form.compact { grid-template-columns: minmax(0, 1fr) minmax(0, 110px) auto; }
.asset-form.compact .prop:first-child { grid-column: 1 / -1; }
.toolbar { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; margin-bottom: 12px; }
.toolbar .inp { flex: 1; min-width: 160px; width: auto; }
.toolbar select.inp { flex: 0 1 220px; }

/* registro */
.day { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 14px 16px; margin-bottom: 12px; }
.day h3 { margin: 0 0 8px; font-family: var(--f-display); font-size: 16px; display: flex; gap: 10px; align-items: baseline; flex-wrap: wrap; }
.day h3 small { font-family: var(--f-mono); font-weight: 400; font-size: 12px; color: var(--faint); }
.day ul { margin: 0 0 8px; padding-left: 18px; }
.day li { margin: 2px 0; overflow-wrap: anywhere; }
.day .note { color: var(--muted); font-size: 14px; white-space: pre-wrap; border-left: 2px solid var(--line); padding-left: 10px; margin: 8px 0; }

/* aree */
.area-card { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 14px 16px; text-decoration: none; color: var(--ink); display: flex; flex-direction: column; gap: 6px; }
.area-card:hover { border-color: var(--faint); }
.area-card h3 { margin: 0; font-family: var(--f-display); font-size: 18px; display: flex; align-items: center; gap: 8px; }
.area-card ul { margin: 0; padding: 0; list-style: none; font-size: 14px; color: var(--muted); }
.area-card li { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.swatches { display: flex; gap: 6px; flex-wrap: wrap; }
.swatches button { width: 22px; height: 22px; border-radius: 50%; border: 2px solid transparent; cursor: pointer; padding: 0; }
.swatches button[aria-pressed="true"] { border-color: var(--ink); }

/* overlay: scheda compito, chiusura, palette */
.ov { position: fixed; inset: 0; background: rgb(10 12 20 / .38); z-index: 20; display: flex; align-items: flex-start; justify-content: center; padding: max(6vh, env(safe-area-inset-top, 0px)) max(16px, env(safe-area-inset-right, 0px)) 16px max(16px, env(safe-area-inset-left, 0px)); overflow-y: auto; }
.ov[hidden] { display: none; }
.sheet { width: 100%; max-width: 560px; background: var(--surface); border-radius: 12px; box-shadow: var(--shadow); padding: 18px 20px; display: flex; flex-direction: column; gap: 12px; }
.sheet.wide { max-width: 680px; }
.sheet h2 { margin: 0; font-family: var(--f-display); font-size: 21px; letter-spacing: -.01em; }
.sheet .sub { color: var(--muted); margin: -6px 0 0; font-size: 14px; }
.sheet .acts { display: flex; gap: 8px; justify-content: flex-end; flex-wrap: wrap; align-items: center; }
.sheet .acts .left { margin-right: auto; }
.grid2 { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 180px), 1fr)); gap: 10px; }
.step { border-top: 1px solid var(--line); padding-top: 12px; display: flex; flex-direction: column; gap: 8px; }
.step h3 { margin: 0; font-size: 14px; font-weight: 600; display: flex; gap: 8px; align-items: baseline; }
.step h3 .n { font-family: var(--f-mono); color: var(--faint); font-weight: 400; font-size: 12px; }
.step ul { margin: 0; padding-left: 18px; }
.mv { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 8px; align-items: center; padding: 6px 0; border-bottom: 1px dashed var(--line); }
.mv:last-child { border-bottom: 0; }
.mv .t { overflow-wrap: anywhere; font-size: 14px; }
.mv select { width: auto; padding: 4px 8px; font-size: 13px; }
.pick { display: flex; align-items: center; gap: 10px; padding: 5px 2px; font-size: 14px; cursor: pointer; }
.pick input { accent-color: var(--accent); width: 16px; height: 16px; flex: none; }
.pal { max-width: 560px; padding: 8px; gap: 4px; }
.pal input { border: 0; outline: none; padding: 10px 10px; font-size: 16px; background: transparent; width: 100%; border-bottom: 1px solid var(--line); }
.pal .res { max-height: 50vh; overflow-y: auto; display: flex; flex-direction: column; gap: 1px; padding-top: 4px; }
.pal .res button { display: flex; align-items: center; gap: 10px; border: 0; background: none; text-align: left; padding: 8px 10px; border-radius: 6px; cursor: pointer; width: 100%; }
.pal .res button[aria-selected="true"] { background: var(--sunken); }
.pal .res small { margin-left: auto; color: var(--faint); font-size: 12px; }

.toast { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(20px + env(safe-area-inset-bottom, 0px)); background: var(--ink); color: var(--bg); padding: 9px 16px; border-radius: 8px; font-size: 14px; z-index: 30; box-shadow: var(--shadow); display: flex; gap: 12px; align-items: center; max-width: calc(100% - 32px); }
.toast[hidden] { display: none; }
.toast button { background: none; border: 0; color: inherit; text-decoration: underline; cursor: pointer; padding: 0; font-weight: 600; }

.tabs { display: none; }
.only-m { display: none; }

@media (max-width: 760px) {
  .app { grid-template-columns: minmax(0, 1fr); }
  .side { display: none; }
  .only-m { display: initial; }
  .main { padding-bottom: calc(84px + env(safe-area-inset-bottom, 0px)); }
  .tabs { display: grid; grid-template-columns: repeat(6, 1fr); position: fixed; left: 0; right: 0; bottom: 0; z-index: 15; background: var(--surface); border-top: 1px solid var(--line); padding: 6px max(8px, env(safe-area-inset-right, 0px)) calc(6px + env(safe-area-inset-bottom, 0px)) max(8px, env(safe-area-inset-left, 0px)); }
  .tabs a { display: flex; flex-direction: column; align-items: center; gap: 2px; font-size: 10.5px; color: var(--faint); text-decoration: none; padding: 4px 0; border-radius: 6px; }
  .tabs a[aria-current="page"] { color: var(--accent); }

<script>
(() => {
'use strict';

/* ---------- utilità ---------- */
const $ = (s, el = document) => el.querySelector(s);
const $$ = (s, el = document) => [...el.querySelectorAll(s)];
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const pad = n => String(n).padStart(2, '0');
const iso = d => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
const fromISO = s => { const [y, m, d] = s.split('-').map(Number); return new Date(y, m - 1, d, 12); };
const todayISO = () => iso(new Date());
const addDays = (s, n) => { const d = fromISO(s); d.setDate(d.getDate() + n); return iso(d); };
const diffDays = (a, b) => Math.round((fromISO(b) - fromISO(a)) / 864e5);
const nextWorkday = s => { let d = addDays(s, 1); while ([0, 6].includes(fromISO(d).getDay())) d = addDays(d, 1); return d; };
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
const nowISO = () => new Date().toISOString();
const normChar = c => (c.normalize('NFD').replace(/[̀-ͯ]/g, '').toLowerCase()[0] ?? c);
const norm = s => [...String(s ?? '')].map(normChar).join('');
const key = s => norm(s).replace(/[^a-z0-9]/g, '');
const slug = s => String(s).replace(/[^\p{L}\p{N}]/gu, '');
const safeUrl = u => /^https?:\/\//i.test(u || '') ? u : null;
const fmtDay = s => fromISO(s).toLocaleDateString('it-IT', { weekday: 'short', day: 'numeric', month: 'short' });
const fmtLong = s => fromISO(s).toLocaleDateString('it-IT', { weekday: 'long', day: 'numeric', month: 'long' });
function relDay(s, today = todayISO()) {
  const n = diffDays(today, s);
  if (n === 0) return 'oggi';
  if (n === 1) return 'domani';
  if (n === -1) return 'ieri';
  if (n < 0) return `${-n} g fa`;
  if (n < 7) return fmtDay(s).split(' ')[0];
  return fmtDay(s);
}
function deadlineText(s, today = todayISO()) {
  const n = diffDays(today, s);
  if (n < 0) return `scaduta da ${-n} g`;
  if (n === 0) return 'scade oggi';
  return `tra ${n} g`;
}
const AREA_COLORS = ['#3a5bd6', '#c47a14', '#2a8c58', '#b23c72', '#6d52cc', '#13899a', '#8b6b3b', '#c2412e'];

/* ---------- parser inserimento rapido ---------- */
const WD = ['domenica', 'lunedi', 'martedi', 'mercoledi', 'giovedi', 'venerdi', 'sabato'];
const MONTHS = ['gennaio', 'febbraio', 'marzo', 'aprile', 'maggio', 'giugno', 'luglio', 'agosto', 'settembre', 'ottobre', 'novembre', 'dicembre'];
const MON3 = ['gen', 'feb', 'mar', 'apr', 'mag', 'giu', 'lug', 'ago', 'set', 'ott', 'nov', 'dic'];
const NUMW = { un: 1, uno: 1, una: 1, due: 2, tre: 3, quattro: 4, cinque: 5, sei: 6, sette: 7, otto: 8, nove: 9, dieci: 10 };
const toNum = s => /^\d+$/.test(s) ? +s : NUMW[s];
const monthIdx = s => { const m = MONTHS.indexOf(s); return m >= 0 ? m : MON3.indexOf(s.replace('.', '')); };
function mkDate(y, m, d) { const dt = new Date(y, m, d, 12); return dt.getMonth() === m && dt.getDate() === d ? iso(dt) : null; }
function futureDM(today, m, d, y) {
  const ty = fromISO(today).getFullYear();
  if (y) return mkDate(y < 100 ? 2000 + y : y, m, d);
  const s = mkDate(ty, m, d);
  return s && s < today ? mkDate(ty + 1, m, d) : s;
}
function nextWeekday(today, wd, prossimo) {
  const t = fromISO(today).getDay();
  let n = (wd - t + 7) % 7 || 7;
  if (prossimo) {
    // "venerdì prossimo" = il venerdì della settimana prossima (se cade ancora in questa settimana)
    const daysToSunday = (7 - t) % 7;
    if (n <= daysToSunday) n += 7;
  }
  return addDays(today, n);
}
const PRE = '(?:^|\\s)(?:(?:entro|per|di|da|a|fino\\s+a)\\s+)?(?:(?:il|la|lo|l\')\\s*)?';
const END = '(?=[\\s,.;:!?)]|$)';
const MONTH_RE = `(${MONTHS.join('|')}|${MON3.join('|')})\\.?`;
const DATE_RULES = [
  [/(oggi|stasera|stamattina|stamani)/, (m, t) => t, 'oggi'],
  [/(dopodomani)/, (m, t) => addDays(t, 2)],
  [/(domani)/, (m, t) => addDays(t, 1)],
  [/(?:tra|fra)\s+(\d{1,3}|un|uno|una|due|tre|quattro|cinque|sei|sette|otto|nove|dieci)\s+(giorni|giorno|settimane|settimana|mesi|mese)/, (m, t) => {
    const n = toNum(m[1]); if (!n) return null;
    if (m[2].startsWith('giorn')) return addDays(t, n);
    if (m[2].startsWith('settiman')) return addDays(t, n * 7);
    const d = fromISO(t); d.setMonth(d.getMonth() + n); return iso(d);
  }],
  [/(prossima\s+settimana|settimana\s+prossima)/, (m, t) => nextWeekday(t, 1, false)],
  [/fine\s+(mese|settimana)/, (m, t) => {
    const d = fromISO(t);
    if (m[1] === 'mese') return iso(new Date(d.getFullYear(), d.getMonth() + 1, 0, 12));
    const wd = d.getDay();
    if (wd === 5) return t;
    return nextWeekday(t, 5, false);
  }],
  [new RegExp(`(\\d{1,2})\\s+${MONTH_RE}(?:\\s+(\\d{4}))?`), (m, t) => {
    const mi = monthIdx(m[2]); if (mi < 0) return null;
    return futureDM(t, mi, +m[1], m[3] ? +m[3] : 0);
  }],
  [/(\d{1,2})[\/-](\d{1,2})(?:[\/-](\d{2,4}))?/, (m, t) => futureDM(t, +m[2] - 1, +m[1], m[3] ? +m[3] : 0)],
  [new RegExp(`(?:(prossim[oa])\\s+)?(${WD.join('|')})(?:\\s+(prossim[oa]))?`), (m, t) => nextWeekday(t, WD.indexOf(m[2]), !!(m[1] || m[3]))],
];
const DAY_ONLY_RE = new RegExp(`(?:^|\\s)(?:(?:entro|per)\\s+)?il\\s+(\\d{1,2})${END}`);

function findDate(text, today) {
  const n = norm(text);
  for (const [core, fn] of DATE_RULES) {
    const re = new RegExp(PRE + core.source + END);
    const m = n.match(re);
    if (m) {
      const coreM = n.slice(m.index).match(core);
      const val = fn(coreM, today);
      if (val) return { due: val, start: m.index, end: m.index + m[0].length };
    }
  }
  const m = n.match(DAY_ONLY_RE);
  if (m) {
    const d = +m[1];
    const t = fromISO(today);
    let s = mkDate(t.getFullYear(), t.getMonth(), d);
    if (s && s < today) { const nx = new Date(t.getFullYear(), t.getMonth() + 1, 1, 12); s = mkDate(nx.getFullYear(), nx.getMonth(), d); }
    if (s) return { due: s, start: m.index, end: m.index + m[0].length };
  }
  return null;
}

function matchTag(tag, ctx) {
  const t = key(tag);
  if (!t) return null;
  let best = null;
  const consider = (kind, item, bonus) => {
    const k = key(item.name);
    if (!k) return;
    let s = k === t ? 3 : k.startsWith(t) ? 2 : k.includes(t) ? 1 : 0;
    if (!s) return;
    s += bonus;
    if (!best || s > best.score) best = { kind, item, score: s };
  };
  for (const p of ctx.projects) consider('project', p, ['completato', 'archiviato'].includes(p.status) ? 0 : 0.2);
  for (const a of ctx.areas) consider('area', a, 0.1);
  return best;
}

function parseQuick(raw, ctx) {
  const today = ctx.today || todayISO();
  let text = ' ' + raw + ' ';
  const out = { title: '', due: null, projectId: null, areaId: null, tag: null, tagMatched: null, waiting: false, waitingFor: '', asset: false, url: null };
  const cut = (start, end) => { text = text.slice(0, start) + ' ' + text.slice(end); };
  const um = text.match(/https?:\/\/[^\s]+/i);
  if (um) { out.url = um[0].replace(/[),.;]+$/, ''); cut(um.index, um.index + um[0].length); }
  const am = text.match(/(^|\s)\+asset(?=\s|$)/i);
  if (am) { out.asset = true; cut(am.index, am.index + am[0].length); }
  const wm = text.match(/(^|\s)@attesa(?::|\s+)?([^\s#@+]*)/i);
  if (wm) { out.waiting = true; out.waitingFor = wm[2] || ''; cut(wm.index, wm.index + wm[0].length); }
  const tm = text.match(/(^|\s)#([\p{L}\p{N}_.\-]+)/u);
  if (tm) {
    out.tag = tm[2];
    const hit = matchTag(tm[2], ctx);
    if (hit) {
      out.tagMatched = hit;
      if (hit.kind === 'project') { out.projectId = hit.item.id; out.areaId = hit.item.areaId || null; }
      else out.areaId = hit.item.id;
    }
    cut(tm.index, tm.index + tm[0].length);
  }
  if (!out.asset) {
    const d = findDate(text, today);
    if (d) { out.due = d.due; cut(d.start, d.end); }
  }
  out.title = text.replace(/\s+/g, ' ').trim().replace(/^[,;:\-–]+\s*|\s*[,;:\-–]+$/g, '');
  return out;
}

/* ---------- tipi di asset ---------- */
const ASSET_TYPES = ['Doc', 'Foglio', 'Slide', 'Cartella', 'File', 'PDF', 'Design', 'Board', 'Repo', 'Notion', 'Link', 'Nota'];
function detectAsset(url) {
  const u = (url || '').toLowerCase();
  if (!u) return { type: 'Nota', name: '' };
  let type = 'Link';
  if (u.includes('docs.google.com/document')) type = 'Doc';
  else if (u.includes('docs.google.com/spreadsheets')) type = 'Foglio';
  else if (u.includes('docs.google.com/presentation')) type = 'Slide';
  else if (u.includes('drive.google.com/drive/folders') || u.includes('drive.google.com/drive/u/')) type = 'Cartella';
  else if (u.includes('drive.google.com')) type = 'File';
  else if (u.includes('notion.so') || u.includes('notion.site')) type = 'Notion';
  else if (u.includes('figma.com')) type = 'Design';
  else if (u.includes('miro.com')) type = 'Board';
  else if (u.includes('github.com') || u.includes('gitlab.com')) type = 'Repo';
  else if (/\.pdf(\?|#|$)/.test(u)) type = 'PDF';
  else if (u.includes('claude.ai/')) type = 'Link';
  let name = '';
  try {
    const p = new URL(url);
    if (type === 'Repo') name = p.pathname.split('/').filter(Boolean).slice(0, 2).join('/');
    else if (!/google|notion|figma|miro/.test(p.hostname)) {
      const last = decodeURIComponent(p.pathname.split('/').filter(Boolean).pop() || '');
      name = last && last.length < 60 ? last.replace(/[-_]+/g, ' ').replace(/\.[a-z0-9]{2,4}$/i, '') : p.hostname.replace(/^www\./, '');
    }
  } catch {}
  return { type, name };
}
const typeAbbr = t => ({ Doc: 'DOC', Foglio: 'XLS', Slide: 'PPT', Cartella: 'DIR', File: 'FILE', PDF: 'PDF', Design: 'FIG', Board: 'BRD', Repo: 'GIT', Notion: 'NTN', Link: 'URL', Nota: 'TXT' }[t] || 'URL');

/* ---------- archivio dati ---------- */
const COLS = ['areas', 'projects', 'tasks', 'assets', 'days'];
const S = {
  db: null, local: false, loaded: new Set(), err: null,
  areas: new Map(), projects: new Map(), tasks: new Map(), assets: new Map(), days: new Map(),
  view: 'oggi', param: null, selId: null, projFilter: 'tutte', assetQ: '', assetF: '', showArchive: false, showAllLog: false,
};

function memoryDB(seed) {
  const data = {}, subs = {};
  for (const c of COLS) data[c] = {};
  if (seed) for (const c of Object.keys(seed)) for (const [id, d] of Object.entries(seed[c])) (data[c] ||= {})[id] = d;
  const meta = { fromCache: false, hasPendingWrites: false };
  const snap = c => { const docs = Object.entries(data[c] || {}).map(([id, d]) => ({ id, exists: true, data: () => d, metadata: meta })); return { docs, size: docs.length, empty: !docs.length, docChanges: () => [], metadata: meta }; };

  return {
    collection(c) {
      return {
        onSnapshot(f) { (subs[c] ||= []).push(f); setTimeout(() => f(snap(c)), 0); return () => {}; },
        doc(id) {
          return {
            async get() { const d = data[c]?.[id]; return { id, exists: !!d, data: () => d, metadata: meta }; },
            async set(d) { (data[c] ||= {})[id] = JSON.parse(JSON.stringify(d)); emit(c); },
            async update(d) { const cur = data[c]?.[id]; if (!cur) throw { code: 'invalid_argument', message: 'missing' }; data[c][id] = { ...cur, ...JSON.parse(JSON.stringify(d)) }; emit(c); },
            async delete() { delete data[c]?.[id]; emit(c); },
          };
        },
      };
    },
  };
}

function dbErr(e) {
  const code = e && e.code;
  if (code === 'quota_exceeded') return 'Spazio dati pieno: elimina qualche vecchio compito o asset e riprova.';
  if (code === 'invalid_argument') return 'Salvataggio rifiutato: non hai i permessi di scrittura su questa pagina.';
  if (code === 'revoked' || code === 'not_granted') return 'Accesso ai dati non disponibile in questa vista.';
  return 'Salvataggio non riuscito, riprova tra poco.';
}
const ref = (c, id) => S.db.collection(c).doc(id);
async function setDoc(c, id, data) { try { await ref(c, id).set(data); return true; } catch (e) { toast(dbErr(e)); return false; } }
async function updDoc(c, id, data) {
  try { await ref(c, id).update(data); return true; }
  catch (e) {
    if (e && e.code === 'unavailable') { await new Promise(r => setTimeout(r, 400 + Math.random() * 600)); try { await ref(c, id).update(data); return true; } catch (e2) { toast(dbErr(e2)); return false; } }
    toast(dbErr(e)); return false;
  }
}
async function delDoc(c, id) { try { await ref(c, id).delete(); return true; } catch (e) { toast(dbErr(e)); return false; } }
const strip = o => { const r = { ...o }; delete r.id; return r; };

let loadTimer = null;
function subscribe() {
  loadTimer = setTimeout(() => { if (S.loaded.size < COLS.length) showBanner('I dati non rispondono ancora. Controlla la connessione: la pagina si aggiorna da sola appena arrivano.'); }, 10000);
  for (const c of COLS) {
    S.db.collection(c).onSnapshot(snap => {
      const m = new Map();
      for (const d of snap.docs) if (d.exists) m.set(d.id, { ...d.data(), id: d.id });
      S[c] = m;
      if (!snap.metadata.fromCache) S.loaded.add(c);
      if (S.loaded.size === COLS.length) { clearTimeout(loadTimer); if (!S.local) showBanner(''); }
      scheduleRender();
    }, e => {
      clearTimeout(loadTimer);
      S.loaded.add(c);
      showBanner(dbErr(e));
      scheduleRender();
    });
  }
}

function showBanner(msg) { const b = $('#banner'); b.textContent = msg; b.hidden = !msg; }

/* ---------- selettori derivati ---------- */
const areasSorted = () => [...S.areas.values()].sort((a, b) => (a.order ?? 0) - (b.order ?? 0) || a.name.localeCompare(b.name));
const projectsAll = () => [...S.projects.values()];
const isActive = p => !p.status || p.status === 'attivo' || p.status === 'in pausa';
const openTasks = () => [...S.tasks.values()].filter(t => t.status !== 'done');
const byDue = (a, b) => (a.due || '9999') .localeCompare(b.due || '9999') || (a.createdAt || '').localeCompare(b.createdAt || '');

const areaColor = a => a ? (a.color || AREA_COLORS[0]) : 'var(--faint)';
function projectTasks(pid) { return [...S.tasks.values()].filter(t => t.projectId === pid); }
function nextAction(pid) { return projectTasks(pid).filter(t => t.status === 'open').sort(byDue)[0] || null; }
function lastActivity(p) {
  let last = (p.updatedAt || p.createdAt || '').slice(0, 10);
  for (const t of projectTasks(p.id)) {
    const d = (t.doneAt || t.createdAt || '').slice(0, 10);
    if (d > last) last = d;
  }
  for (const day of S.days.values()) if ((day.extra || []).some(x => x.projectId === p.id) && day.date > last) last = day.date;
  return last || null;
}
function hillState(h) { h = +h || 0; if (h >= 100) return ['down', 'In cima: fatto']; return h < 50 ? ['up', 'In salita'] : ['down', 'In discesa']; }
function lastPlan(today) {
  let best = null;
  for (const d of S.days.values()) if (d.tomorrowDate && d.tomorrowDate <= today && d.date < today && (!best || d.date > best.date)) best = d;
  return best && best.tomorrowDate === today ? best : (best && diffDays(best.tomorrowDate, today) <= 3 ? best : null);
}
const ctxForParse = () => ({ projects: projectsAll(), areas: [...S.areas.values()], today: todayISO() });

/* ---------- render ---------- */
let renderQueued = false;
function scheduleRender() { if (renderQueued) return; renderQueued = true; requestAnimationFrame(() => { renderQueued = false; render(); }); }

const ICONS = {
  oggi: '<path d="M12 3v2M12 19v2M4.2 4.2l1.4 1.4M18.4 18.4l1.4 1.4M3 12h2M19 12h2M4.2 19.8l1.4-1.4M18.4 5.6l1.4-1.4"/><circle cx="12" cy="12" r="4"/>',
  prossimi: '<rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4"/>',
  progetti: '<path d="M2 19C7 19 8 6 12 6s5 13 10 13"/>',
  aree: '<rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/><rect x="3" y="14" width="7" height="7" rx="1.5"/><rect x="14" y="14" width="7" height="7" rx="1.5"/>',
  asset: '<path d="M10 13a5 5 0 0 0 7.5.5l3-3a5 5 0 0 0-7-7l-1.7 1.7"/><path d="M14 11a5 5 0 0 0-7.5-.5l-3 3a5 5 0 0 0 7 7l1.7-1.7"/>',
  registro: '<path d="M5 4h11l3 3v13H5z"/><path d="M9 10h6M9 14h6M9 18h3"/>',
};
const icon = (n, s = 18) => `<svg width="${s}" height="${s}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${ICONS[n]}</svg>`;
const VIEWS = [['oggi', 'Oggi'], ['prossimi', 'Prossimi'], ['progetti', 'Progetti'], ['aree', 'Aree'], ['asset', 'Asset'], ['registro', 'Registro']];

function renderNav() {
  const today = todayISO();
  const tdy = openTasks().filter(t => t.status === 'open' && t.due && t.due <= today);
  const late = tdy.filter(t => t.due < today).length;
  const counts = { oggi: tdy.length, progetti: projectsAll().filter(p => p.status === 'attivo' || !p.status).length, asset: S.assets.size };
  const cur = S.view === 'progetto' ? 'progetti' : S.view === 'area' ? 'aree' : S.view;
  $('#nav').innerHTML = VIEWS.map(([v, l]) => `<a class="nav-a" href="#${v}" ${cur === v ? 'aria-current="page"' : ''}>${icon(v)}${l}${counts[v] ? `<span class="count ${v === 'oggi' && late ? 'hot' : ''}">${counts[v]}</span>` : ''}</a>`).join('');
  $('#tabs').innerHTML = VIEWS.map(([v, l]) => `<a href="#${v}" ${cur === v ? 'aria-current="page"' : ''}>${icon(v, 20)}${l}</a>`).join('');
  const areas = areasSorted();

}

function chipProject(t, opts = {}) {
  const p = t.projectId && S.projects.get(t.projectId);
  const a = p ? (p.areaId && S.areas.get(p.areaId)) : (t.areaId && S.areas.get(t.areaId));
  if (p && !opts.noProject) return `<a class="chip" href="#p-${p.id}"><span class="dot" style="background:${esc(areaColor(a))}"></span>${esc(p.name)}</a>`;
  if (!p && a && !opts.noArea) return `<a class="chip" href="#a-${a.id}"><span class="dot" style="background:${esc(areaColor(a))}"></span>${esc(a.name)}</a>`;
  return '';
}

function taskRow(t, opts = {}) {
  const today = todayISO();
  const done = t.status === 'done';
  const wait = t.status === 'waiting';
  const meta = [];
  meta.push(chipProject(t, opts));
  if (wait) meta.push(`<span class="chip up">In attesa${t.waitingFor ? ' di ' + esc(t.waitingFor) : ''}</span>`);
  if (t.note) meta.push(`<span class="chip" title="${esc(t.note)}">nota</span>`);
  let when = '';
  if (done && t.doneAt) when = `<span class="when">${esc(relDay(t.doneAt.slice(0, 10), today))}</span>`;
  else if (t.due && !opts.noDate) when = `<span class="when ${t.due < today ? 'late' : ''}">${esc(relDay(t.due, today))}</span>`;
  return `<div class="row ${done ? 'done' : ''} ${S.selId === t.id ? 'sel' : ''}" data-task="${esc(t.id)}">
    <button class="check ${done ? 'on' : ''} ${wait ? 'wait' : ''}" data-act="toggle" aria-label="${done ? 'Riapri' : 'Segna come fatto'}: ${esc(t.title)}">${done ? '<svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12l5 5 9-10"/></svg>' : ''}</button>
    <div class="body"><div class="t" data-act="edit">${esc(t.title)}</div><div class="meta">${meta.join('')}</div></div>${when}</div>`;
}
const taskList = (arr, opts) => `<div class="list">${arr.map(t => taskRow(t, opts)).join('')}</div>`;

function hillPath(w, h, base, amp) {
  let d = '';
  for (let i = 0; i <= 60; i++) { const x = i / 60; d += (i ? 'L' : 'M') + (x * w).toFixed(1) + ' ' + (base - amp * Math.sin(Math.PI * x)).toFixed(1); }
  return d;
}
const hillY = (x, base, amp) => base - amp * Math.sin(Math.PI * x);
function miniHill(h, w = 64, ht = 20) {
  const x = Math.min(100, Math.max(0, +h || 0)) / 100;
  const [st] = hillState(h);
  return `<svg width="${w}" height="${ht}" viewBox="0 0 ${w} ${ht}" aria-hidden="true"><path d="${hillPath(w, ht, ht - 2, ht - 6)}" fill="none" stroke="var(--line)" stroke-width="2"/><circle cx="${(x * (w - 8) + 4).toFixed(1)}" cy="${hillY(x, ht - 2, ht - 6).toFixed(1)}" r="4" fill="var(--${st})"/></svg>`;
}
function bigHill(projects) {
  const W = 720, H = 210, base = 170, amp = 120, padX = 30;
  const iw = W - padX * 2;
  const pts = projects.map(p => ({ p, x: Math.min(100, Math.max(0, +p.hill || 0)) / 100 })).sort((a, b) => a.x - b.x);
  let lastX = -1e9, flip = false;
  const marks = pts.map(({ p, x }) => {
    const cx = padX + x * iw, cy = hillY(x, base, amp);
    if (cx - lastX < 90) flip = !flip; else flip = false;
    lastX = cx;
    const ly = flip ? cy + 22 : cy - 12;
    const anchor = cx < 90 ? 'start' : cx > W - 90 ? 'end' : 'middle';
    const [st] = hillState(p.hill);
    const name = p.name.length > 22 ? p.name.slice(0, 21) + '…' : p.name;
    return `<a href="#p-${esc(p.id)}"><circle cx="${cx.toFixed(1)}" cy="${cy.toFixed(1)}" r="7" fill="var(--${st})" stroke="var(--surface)" stroke-width="2"/><text class="hill-lbl" x="${cx.toFixed(1)}" y="${ly.toFixed(1)}" text-anchor="${anchor}">${esc(name)}</text></a>`;
  }).join('');
  return `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Hill chart dei progetti attivi">
    <line x1="${W / 2}" y1="${base - amp - 4}" x2="${W / 2}" y2="${base + 4}" stroke="var(--line)" stroke-dasharray="3 4"/>
    <path d="${hillPath(iw, H, base, amp)}" transform="translate(${padX} 0)" fill="none" stroke="var(--faint)" stroke-width="2"/>
    <line x1="${padX}" y1="${base}" x2="${W - padX}" y2="${base}" stroke="var(--line)"/>
    <text class="hill-axis" x="${padX + iw * 0.25}" y="${base + 26}" text-anchor="middle">In salita · da capire</text>
    <text class="hill-axis" x="${padX + iw * 0.75}" y="${base + 26}" text-anchor="middle">In discesa · da fare</text>
    ${marks}</svg>`;
}

function render() {
  const active = document.activeElement;
  const keep = active && active.id && $('#view').contains(active) ? { id: active.id, value: active.value, s: active.selectionStart, e: active.selectionEnd } : null;
  renderNav();
  const v = $('#view');
  const fn = { oggi: viewOggi, prossimi: viewProssimi, progetti: viewProgetti, progetto: viewProgetto, aree: viewAree, area: viewArea, asset: viewAsset, registro: viewRegistro }[S.view] || viewOggi;
  v.innerHTML = fn();
  if (keep) {

    if (el) { if ('value' in el && keep.value !== undefined) el.value = keep.value; el.focus(); try { el.setSelectionRange(keep.s, keep.e); } catch {} }
  }
  if (S.focusAfter) { const el = document.getElementById(S.focusAfter); S.focusAfter = null; if (el) { el.focus(); el.select?.(); } }
  updatePreview();
}

/* Oggi */
function viewOggi() {
  const today = todayISO();
  const open = openTasks();
  const plan = lastPlan(today);
  const prio = plan ? (plan.tomorrow || []).map(id => S.tasks.get(id)).filter(t => t && t.status !== 'done') : [];
  const prioIds = new Set(prio.map(t => t.id));
  const late = open.filter(t => t.status === 'open' && t.due && t.due < today && !prioIds.has(t.id)).sort(byDue);
  const tdy = open.filter(t => t.status === 'open' && t.due === today && !prioIds.has(t.id)).sort(byDue);
  const waiting = open.filter(t => t.status === 'waiting').sort(byDue);
  const doneToday = [...S.tasks.values()].filter(t => t.status === 'done' && (t.doneAt || '').slice(0, 10) === today).sort((a, b) => (b.doneAt || '').localeCompare(a.doneAt || ''));
  const closed = S.days.get(today)?.closedAt;
  const act = projectsAll().filter(p => p.status === 'attivo' || !p.status).sort((a, b) => (a.deadline || '9999').localeCompare(b.deadline || '9999'));
  const strip = act.length ? `<section class="block"><h2 class="sec">Progetti attivi <span class="n">${act.length}</span></h2><div class="strip">${act.map(p => {
    const a = p.areaId && S.areas.get(p.areaId);
    const dl = p.deadline ? `<span class="${diffDays(today, p.deadline) < 7 ? 'mono" style="color:var(--danger)' : 'mono'}">${esc(deadlineText(p.deadline, today))}</span>` : '<span>senza scadenza</span>';
    return `<a href="#p-${esc(p.id)}"><span class="ln"><span class="dot" style="background:${esc(areaColor(a))}"></span>${esc(a?.name || 'Senza area')}</span><span class="nm">${esc(p.name)}</span><span class="ln">${miniHill(p.hill, 44, 16)}${dl}</span></a>`;
  }).join('')}</div></section>` : '';
  const total = prio.length + late.length + tdy.length;
  let body = '';
  if (prio.length) body += `<section class="block"><h2 class="sec">Priorità decise alla chiusura <span class="n">${prio.length}</span></h2>${taskList(prio)}</section>`;
  if (late.length) body += `<section class="block"><h2 class="sec danger">In ritardo <span class="n">${late.length}</span></h2>${taskList(late)}</section>`;
  body += `<section class="block"><h2 class="sec">Oggi <span class="n">${tdy.length}</span></h2>${tdy.length ? taskList(tdy, { noDate: true }) : (total ? '<div class="empty">Nient\'altro in programma per oggi.</div>' : `<div class="empty"><b>Niente in programma per oggi.</b> Scrivi nella barra in alto, per esempio «chiamare Marco venerdì #CloudSherpa». Senza data, un compito scritto qui finisce in Oggi.</div>`)}</section>`;
  if (waiting.length) body += `<section class="block"><h2 class="sec">In attesa <span class="n">${waiting.length}</span></h2>${taskList(waiting)}</section>`;
  if (doneToday.length) body += `<section class="block"><h2 class="sec">Fatto oggi <span class="n">${doneToday.length}</span></h2>${taskList(doneToday)}</section>`;
  return `<div class="head-row"><div class="grow"><h1 class="view-title">Oggi</h1><p class="view-sub"><span>${esc(fmtLong(today))}</span>${closed ? '<span class="chip down">Giornata chiusa</span>' : ''}</p></div>
    <button class="btn ${closed ? '' : 'primary'}" data-act="close-day">${closed ? 'Rivedi la chiusura' : 'Chiudi la giornata'}</button></div>${strip}${body}`;
}

/* Prossimi */
function viewProssimi() {
  const today = todayISO();
  const open = openTasks().filter(t => t.status === 'open');
  const future = open.filter(t => t.due && t.due > today).sort(byDue);
  const groups = new Map();
  const horizon = addDays(today, 14);
  for (const t of future) { const k = t.due <= horizon ? t.due : 'later'; if (!groups.has(k)) groups.set(k, []); groups.get(k).push(t); }
  let html = `<h1 class="view-title">Prossimi</h1><p class="view-sub">I compiti con una data, giorno per giorno, poi quelli senza data.</p>`;
  if (!future.length) html += `<div class="empty">Nessun compito con data futura. Aggiungi una data scrivendo «domani», «lunedì», «tra 3 giorni» o «15/11».</div>`;
  for (const [k, arr] of groups) {
    const rd = relDay(k, today);
    const title = k === 'later' ? 'Più avanti' : (rd === 'oggi' || rd === 'domani') ? `${rd} · ${fmtDay(k)}` : fmtDay(k);
    html += `<section class="block"><h2 class="sec">${esc(title)} <span class="n">${arr.length}</span></h2>${taskList(arr, { noDate: k !== 'later' })}</section>`;
  }
  const nodate = open.filter(t => !t.due).sort(byDue);
  if (nodate.length) html += `<section class="block"><h2 class="sec">Senza data <span class="n">${nodate.length}</span></h2>${taskList(nodate)}</section>`;
  const waiting = openTasks().filter(t => t.status === 'waiting');
  if (waiting.length) html += `<section class="block"><h2 class="sec">In attesa <span class="n">${waiting.length}</span></h2>${taskList(waiting)}</section>`;
  return html;
}

function viewProgetti() {

  const arch = all.filter(p => !isActive(p)).sort((a, b) => (b.updatedAt || '').localeCompare(a.updatedAt || ''));
  const filters = `<div class="filters" role="group" aria-label="Filtra per area"><button data-act="pfilter" data-v="tutte" aria-pressed="${f === 'tutte'}">Tutte</button>${areas.map(a => `<button data-act="pfilter" data-v="${esc(a.id)}" aria-pressed="${f === a.id}"><span class="dot" style="background:${esc(areaColor(a))}"></span>${esc(a.name)}</button>`).join('')}${projectsAll().some(p => !p.areaId) ? `<button data-act="pfilter" data-v="none" aria-pressed="${f === 'none'}">Senza area</button>` : ''}</div>`;
  const onHill = active.filter(p => (p.status || 'attivo') === 'attivo');
  let html = `<div class="head-row"><div class="grow"><h1 class="view-title">Progetti</h1><p class="view-sub">Dove sta ogni progetto: in salita finché è da capire, in discesa quando resta da eseguire.</p></div><button class="btn primary" data-act="new-project">Nuovo progetto</button></div>${filters}`;

  return html;
}

function activityFor(match) {
  const items = [];
  for (const t of S.tasks.values()) if (t.status === 'done' && t.doneAt && match(t)) items.push({ date: t.doneAt.slice(0, 10), text: t.title, kind: 'compito' });
  for (const d of S.days.values()) for (const x of d.extra || []) if (match(x)) items.push({ date: d.date, text: x.text, kind: 'nota' });
  items.sort((a, b) => b.date.localeCompare(a.date));
  return items;
}
function timeline(items, limit) {

  const groups = new Map();
  for (const it of shown) { if (!groups.has(it.date)) groups.set(it.date, []); groups.get(it.date).push(it); }
  return `<div class="tl">${[...groups].map(([d, arr]) => `<div class="tl-day"><div class="d">${esc(fmtDay(d))}</div><ul>${arr.map(it => `<li>${esc(it.text)}<span class="k">${it.kind}</span></li>`).join('')}</ul></div>`).join('')}</div>`;

}

/* Asset */
function viewAsset() {
  const q = norm(S.assetQ.trim());
  const f = S.assetF;
  let list = [...S.assets.values()];
  if (f) list = list.filter(x => f.startsWith('p:') ? x.projectId === f.slice(2) : (x.areaId === f.slice(2) || (x.projectId && S.projects.get(x.projectId)?.areaId === f.slice(2))));
  if (q) list = list.filter(x => norm(`${x.name} ${x.type} ${x.note || ''} ${x.url || ''} ${S.projects.get(x.projectId)?.name || ''}`).includes(q));
  list.sort((a, b) => (b.createdAt || '').localeCompare(a.createdAt || ''));
  return `<h1 class="view-title">Asset</h1><p class="view-sub">Documenti, cartelle, design, repo: tutto quello che hai a disposizione, a un clic.</p>

      <select class="inp" id="asset-f" aria-label="Filtra per progetto o area">${projectOptions(f, true, 'Tutti i progetti e le aree')}</select></div>
    ${assetRows(list, { empty: S.assets.size ? 'Nessun asset corrisponde alla ricerca.' : '<b>La libreria è vuota.</b> Incolla un link qui sopra: tipo e nome vengono proposti da soli.' })}`;
}

/* Registro */
function viewRegistro() {
  const days = [...S.days.values()].filter(d => d.closedAt || (d.extra || []).length).sort((a, b) => b.date.localeCompare(a.date));
  let html = `<h1 class="view-title">Registro</h1><p class="view-sub">Le giornate chiuse: cosa hai fatto e cosa avevi deciso per il giorno dopo.</p>`;
  if (!days.length) return html + `<div class="empty"><b>Ancora nessuna giornata chiusa.</b> A fine giornata premi «Chiudi la giornata» in Oggi (o il tasto C): ci vogliono due minuti.</div>`;
  for (const d of days) {
    const done = (d.done || []);
    const extra = d.extra || [];
    const tom = (d.tomorrow || []).map(id => S.tasks.get(id)).filter(Boolean);
    const pn = x => { const p = x.projectId && S.projects.get(x.projectId); const a = !p && x.areaId && S.areas.get(x.areaId); return p ? ` <a class="chip" href="#p-${esc(p.id)}">${esc(p.name)}</a>` : a ? ` <a class="chip" href="#a-${esc(a.id)}">${esc(a.name)}</a>` : ''; };
    html += `<article class="day"><h3>${esc(fmtLong(d.date))}<small>${done.length + extra.length} cose fatte</small></h3>
      ${done.length || extra.length ? `<ul>${done.map(x => `<li>${esc(x.title)}${pn(x)}</li>`).join('')}${extra.map(x => `<li>${esc(x.text)}${pn(x)}</li>`).join('')}</ul>` : ''}
      ${d.note ? `<div class="note">${esc(d.note)}</div>` : ''}
      ${tom.length ? `<div style="font-size:13.5px;color:var(--muted)">Priorità per ${esc(fmtDay(d.tomorrowDate || addDays(d.date, 1)))}: ${tom.map(t => `<span class="${t.status === 'done' ? '' : ''}">${t.status === 'done' ? '✓ ' : ''}${esc(t.title)}</span>`).join(' · ')}</div>` : ''}</article>`;
  }
  return html;
}

/* ---------- inserimento rapido ---------- */
const qa = $('#qa');
let acState = null;
function defaultsForView() {
  if (S.view === 'progetto' && S.projects.get(S.param)) return { projectId: S.param, label: S.projects.get(S.param).name };
  if (S.view === 'area' && S.areas.get(S.param)) return { areaId: S.param, label: S.areas.get(S.param).name };
  return {};
}
function updatePreview() {
  const box = $('#qa-preview');
  const val = qa.value.trim();
  if (!val) { box.innerHTML = ''; return; }
  const r = parseQuick(val, ctxForParse());
  const def = defaultsForView();
  const chips = [];
  if (r.asset || (r.url && !r.title)) {
    const d = detectAsset(r.url);
    chips.push(`<span class="chip accent">Asset · ${esc(d.type)}</span>`);
    chips.push(`<span class="chip">${esc(r.title || d.name || r.url || '')}</span>`);
  } else {
    chips.push(`<span class="chip">${esc(r.title || '…')}</span>`);
    const due = r.due || (!r.waiting && S.view === 'oggi' ? todayISO() : null);
    if (due) chips.push(`<span class="chip accent">${esc(fmtDay(due))}${r.due ? '' : ' (vista Oggi)'}</span>`);
    if (r.waiting) chips.push(`<span class="chip up">In attesa${r.waitingFor ? ' di ' + esc(r.waitingFor) : ''}</span>`);
  }
  if (r.tagMatched) chips.push(`<span class="chip accent">${r.tagMatched.kind === 'project' ? 'Progetto' : 'Area'}: ${esc(r.tagMatched.item.name)}</span>`);
  else if (r.tag) chips.push(`<span class="chip danger">#${esc(r.tag)} non trovato</span>`);
  else if (def.label) chips.push(`<span class="chip">${esc(def.label)}</span>`);
  box.innerHTML = chips.join('') + `<span class="chip" style="background:transparent">Invio per salvare</span>`;
}
function acCandidates(frag) {
  const t = key(frag);
  const items = [
    ...projectsAll().filter(isActive).map(p => ({ kind: 'Progetto', name: p.name, color: areaColor(p.areaId && S.areas.get(p.areaId)) })),
    ...areasSorted().map(a => ({ kind: 'Area', name: a.name, color: areaColor(a) })),
  ];
  return items.filter(i => !t || key(i.name).includes(t)).slice(0, 6);
}
function updateAC() {
  const pos = qa.selectionStart ?? qa.value.length;
  const before = qa.value.slice(0, pos);
  const m = before.match(/(^|\s)#([\p{L}\p{N}_.\-]*)$/u);
  const box = $('#ac');
  if (!m) { acState = null; box.hidden = true; return; }
  const list = acCandidates(m[2]);
  if (!list.length) { acState = null; box.hidden = true; return; }
  acState = { list, i: Math.min(acState?.i ?? 0, list.length - 1), start: pos - m[2].length - 1, end: pos };
  box.innerHTML = list.map((it, i) => `<button type="button" data-i="${i}" aria-selected="${i === acState.i}"><span class="dot" style="background:${esc(it.color)}"></span>${esc(it.name)}<small>${it.kind}</small></button>`).join('');
  box.hidden = false;
}
function applyAC(i) {
  if (!acState) return;
  const it = acState.list[i];
  const v = qa.value;
  const ins = '#' + slug(it.name) + ' ';
  qa.value = v.slice(0, acState.start) + ins + v.slice(acState.end).replace(/^\s+/, '');
  const p = acState.start + ins.length;
  qa.setSelectionRange(p, p);
  acState = null; $('#ac').hidden = true;
  updatePreview();
}
qa.addEventListener('input', () => { updateAC(); updatePreview(); });
qa.addEventListener('keydown', e => {
  if (acState) {
    if (e.key === 'ArrowDown' || e.key === 'ArrowUp') { e.preventDefault(); acState.i = (acState.i + (e.key === 'ArrowDown' ? 1 : -1) + acState.list.length) % acState.list.length; updateACSel(); return; }
    if (e.key === 'Tab' || (e.key === 'Enter' && !e.isComposing)) { e.preventDefault(); applyAC(acState.i); return; }
  }
  if (e.key === 'Escape') { if (acState) { acState = null; $('#ac').hidden = true; } else { qa.value = ''; updatePreview(); qa.blur(); } }
});
function updateACSel() { $$('#ac button').forEach((b, i) => b.setAttribute('aria-selected', String(i === acState.i))); }
$('#ac').addEventListener('mousedown', e => { const b = e.target.closest('button'); if (b) { e.preventDefault(); applyAC(+b.dataset.i); } });
qa.addEventListener('blur', () => setTimeout(() => { $('#ac').hidden = true; acState = null; }, 120));

async function createFromText(text, defaults = {}, viewToday = false) {
  const r = parseQuick(text, ctxForParse());
  const now = nowISO();
  const projectId = r.projectId ?? (r.areaId ? null : defaults.projectId ?? null);
  const areaId = r.projectId ? (S.projects.get(r.projectId)?.areaId || null) : (r.areaId ?? (projectId ? null : defaults.areaId ?? null));
  if (r.asset || (r.url && !r.title)) {
    const d = detectAsset(r.url);
    const name = r.title || d.name || r.url;
    if (!name) return null;
    const id = uid();
    const ok = await setDoc('assets', id, { name, type: d.type, url: r.url || '', projectId, areaId: projectId ? null : areaId, note: '', createdAt: now });
    if (ok) toast(`Asset aggiunto: ${name}`);
    return ok ? id : null;
  }
  if (!r.title) return null;
  const due = r.due || (viewToday && !r.waiting ? todayISO() : null);
  const id = uid();
  const ok = await setDoc('tasks', id, { title: r.title + (r.url ? ' ' + r.url : ''), projectId, areaId: projectId ? null : areaId, due, status: r.waiting ? 'waiting' : 'open', waitingFor: r.waitingFor || '', note: '', createdAt: now, doneAt: null });
  if (ok) {
    if (projectId) touchProject(projectId);
    toast(`Aggiunto${due ? ' per ' + relDay(due) : ''}${r.tag && !r.tagMatched ? ` (#${r.tag} non trovato)` : ''}`);
  }
  return ok ? id : null;
}
$('#qa-form').addEventListener('submit', async e => {
  e.preventDefault();
  if (acState) return;
  const text = qa.value.trim();
  if (!text) return;
  qa.value = '';
  updatePreview();
  await createFromText(text, defaultsForView(), S.view === 'oggi');
});

function touchProject(id) { if (S.projects.has(id)) updDoc('projects', id, { updatedAt: nowISO() }); }

/* ---------- azioni ---------- */
async function toggleTask(id) {
  const t = S.tasks.get(id);
  if (!t) return;
  if (t.status === 'done') { await updDoc('tasks', id, { status: 'open', doneAt: null }); return; }
  await updDoc('tasks', id, { status: 'done', doneAt: nowISO() });
  if (t.projectId) touchProject(t.projectId);
  toast('Fatto', () => updDoc('tasks', id, { status: t.status, doneAt: null }));
}

let toastTimer;
function toast(msg, undo) {
  const el = $('#toast');
  el.innerHTML = `<span>${esc(msg)}</span>${undo ? '<button type="button">Annulla</button>' : ''}`;
  el.hidden = false;
  if (undo) el.querySelector('button').onclick = () => { undo(); el.hidden = true; };
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => { el.hidden = true; }, undo ? 5000 : 2600);
}

async function newProject(areaId) {
  const id = uid(), now = nowISO();

}
async function newArea() {
  const id = uid();
  const ok = await setDoc('areas', id, { name: 'Nuova area', color: AREA_COLORS[S.areas.size % AREA_COLORS.length], order: S.areas.size, createdAt: nowISO() });

}
